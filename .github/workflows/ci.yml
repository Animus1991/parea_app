name: CI

on:
  push:
    branches: [main, master, 'ccr-*', 'cursor/**']
  pull_request:
    branches: [main, master, 'ccr-*', 'cursor/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:eslint
      - run: npm run audit:contrast
      - run: npm run test
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: placeholder

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: E2E (Playwright)
    # Playwright 1.60 does not support Chromium on ubuntu26.04 (ubuntu-latest as of 2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
