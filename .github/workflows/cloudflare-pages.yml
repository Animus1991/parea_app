name: Cloudflare Pages

on:
  push:
    branches: [main, master, 'ccr-*', 'cursor/**']
  pull_request:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ''
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare deploy skipped — add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for pages.dev previews."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=nakamas --branch="${CF_BRANCH}"
