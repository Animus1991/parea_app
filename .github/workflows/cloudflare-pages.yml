name: Cloudflare Pages

on:
  push:
    branches: [main, master, 'ccr-*', 'cursor/**']
  pull_request:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ''
      - name: Publish to Cloudflare Pages
        # Skip cleanly when CF secrets are not configured (audit/dev forks).
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nakamas --branch=${{ github.head_ref || github.ref_name }}
      - name: Notice when secrets missing
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Cloudflare deploy skipped — add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for pages.dev previews."
